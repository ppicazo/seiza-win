[package]
name = "seiza-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
seiza = "=0.41.0"
seiza-stacking = "=0.44.0"
seiza-fits = "=0.5.1"
seiza-image-io = "=0.10.0"
seiza-xisf = "=0.6.1"
serde = { version = "1", features = ["derive"] }
seiza-download = "=0.9.0"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
